name: Tighten industrial meta descriptions
on:
  push:
    paths:
      - '.github/workflows/fix-industrial-meta.yml'
permissions:
  contents: write
jobs:
  fix-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten four meta descriptions
        shell: python
        run: |
          from pathlib import Path
          fixes = {
            'food-processing-marketing-pakistan.html': (
              'Digital marketing for food processing companies in Pakistan targeting distributors, retailers, HORECA and private-label buyers through SEO, Ads and lead funnels.',
              'Digital marketing for food processors in Pakistan targeting distributors, retailers, HORECA and private-label buyers through SEO, Ads and lead funnels.'
            ),
            'leather-tannery-marketing-pakistan.html': (
              'Digital marketing for leather manufacturers and tanneries in Pakistan targeting sourcing teams, brands and exporters through SEO, Google Ads and B2B lead generation.',
              'Digital marketing for leather manufacturers and tanneries in Pakistan targeting brands, sourcing teams and export buyers through SEO, Ads and B2B lead generation.'
            ),
            'surgical-instrument-manufacturer-marketing-pakistan.html': (
              'Digital marketing for surgical instrument manufacturers in Pakistan targeting distributors, OEM and export buyers through SEO, Google Ads and B2B lead generation.',
              'Digital marketing for surgical instrument manufacturers in Pakistan targeting distributors, OEM and export buyers through SEO, Ads and B2B lead generation.'
            ),
            'sports-goods-manufacturer-marketing-pakistan.html': (
              'Digital marketing for sports goods manufacturers in Pakistan targeting brands, importers and distributors through SEO, Google Ads, OEM and export lead generation.',
              'Digital marketing for sports goods manufacturers in Pakistan targeting brands, importers and distributors through SEO, Ads, OEM and export lead generation.'
            )
          }
          for name,(old,new) in fixes.items():
              p=Path(name); t=p.read_text(encoding='utf-8')
              if old not in t: raise SystemExit(f'old meta not found: {name}')
              p.write_text(t.replace(old,new),encoding='utf-8')
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-industrial-meta.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: tighten industrial meta descriptions"
          git push
