name: Ecommerce Internal Link Check
on:
  pull_request:
    paths:
      - ecommerce-agency-pakistan.html
      - performance-marketing.html
      - tools/ecommerce-proof-links-check.py
      - .github/workflows/ecommerce-proof-links.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check commercial proof links and canonical URLs
        run: python3 tools/ecommerce-proof-links-check.py
