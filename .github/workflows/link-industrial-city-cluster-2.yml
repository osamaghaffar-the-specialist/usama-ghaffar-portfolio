name: Wire industrial city cluster 2
on:
  push:
    branches: [industrial-city-cluster-2]
    paths: ['.github/workflows/link-industrial-city-cluster-2.yml']
permissions:
  contents: write
jobs:
  wire-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: industrial-city-cluster-2
      - name: Add manufacturer hub links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('manufacturer-digital-marketing-pakistan.html')
          s = p.read_text()
          marker = '<h2>B2B acquisition channels</h2>'
          section = '<h2>More manufacturing cities across Pakistan</h2><p>We also serve manufacturers in <a href="manufacturing-marketing-agency-gujrat.html">Gujrat</a>, <a href="manufacturing-marketing-agency-wazirabad.html">Wazirabad</a>, <a href="manufacturing-marketing-agency-chiniot.html">Chiniot</a>, <a href="manufacturing-marketing-agency-sahiwal.html">Sahiwal</a>, <a href="manufacturing-marketing-agency-hyderabad.html">Hyderabad</a> and <a href="manufacturing-marketing-agency-peshawar.html">Peshawar</a>. These pages reflect each city’s real industrial mix and buyer journeys. They describe service coverage only; Bee Marketing does not claim branch offices in these cities where none exist.</p>'
          if section not in s:
              if marker not in s:
                  raise SystemExit('Insertion marker not found')
              s = s.replace(marker, section + marker, 1)
              p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/link-industrial-city-cluster-2.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manufacturer-digital-marketing-pakistan.html .github/workflows/link-industrial-city-cluster-2.yml
          git commit -m 'SEO: link industrial city cluster 2 from manufacturer hub'
          git push origin HEAD:industrial-city-cluster-2
