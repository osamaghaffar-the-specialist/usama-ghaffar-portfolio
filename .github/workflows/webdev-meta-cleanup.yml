name: Web Development Meta Cleanup

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten web development meta description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web-development-agency-pakistan.html')
          text = p.read_text(encoding='utf-8')
          old = 'Web development agency in Pakistan building conversion-focused business and ecommerce websites with SEO-ready structure, speed, tracking and marketing integration.'
          new = 'Web development agency in Pakistan building conversion-focused business and ecommerce websites with SEO-ready structure, speed, tracking and growth integration.'
          if old not in text:
              raise SystemExit('Expected meta description not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/webdev-meta-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: finalize web development meta description"
          git push
