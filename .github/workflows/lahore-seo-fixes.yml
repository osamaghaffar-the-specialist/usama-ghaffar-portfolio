name: Fix Lahore SEO details
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply SEO fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          loc_pages = {
            'digital-marketing-agency-valencia-town-lahore.html': '''<section class="section"><div class="wrap"><h2>A practical Valencia Town growth plan</h2><p>For a service business, we would normally begin by separating high-intent search demand from discovery demand. Google Ads can capture people already looking for a provider, while Meta Ads can introduce the offer to a wider audience and bring previous visitors back through retargeting. SEO then supports the longer-term search layer by improving the website's technical quality, service relevance and useful answers.</p><p>The conversion path matters just as much. A visitor should understand the offer quickly, see credible proof, know what action to take and receive a fast response after submitting an enquiry. For that reason, our work can include landing-page recommendations, conversion tracking, CRM workflows and reporting that connects the campaign to qualified leads or sales rather than only traffic.</p><p>For brands selling online, the plan changes toward product economics, creative testing, shopping intent, remarketing and conversion rate optimization. The objective remains the same: build a measurable acquisition system that can be improved with real data.</p></div></section>''',
            'digital-marketing-agency-eme-society-lahore.html': '''<section class="section"><div class="wrap"><h2>A practical EME Society growth plan</h2><p>Businesses serving EME Society should first identify how customers actually discover them. If buyers search directly for the service, Google Ads and SEO can capture that intent. If the purchase is more visual or comparison-driven, Meta Ads can help create demand, communicate the offer and retarget people who already showed interest.</p><p>We then check the conversion layer: landing-page clarity, mobile speed, forms, calls, trust signals and response time. Traffic becomes expensive when the next step is confusing or enquiries are not followed up consistently. Tracking and CRM structure make it easier to see where opportunities are being lost and which campaigns are producing meaningful leads.</p><p>For businesses with a wider Lahore or Pakistan market, the local campaign can sit inside a broader acquisition strategy rather than operating as an isolated neighbourhood campaign. This avoids over-targeting and keeps budget focused on the searches and audiences that show real commercial intent.</p></div></section>''',
            'digital-marketing-agency-model-town-lahore.html': '''<section class="section"><div class="wrap"><h2>A practical Model Town growth plan</h2><p>Model Town businesses often need a balance between local discovery and city-wide customer acquisition. Search campaigns can focus on people actively comparing providers, while Meta Ads can support awareness, offer-led campaigns and retargeting. SEO can build a durable presence for service and informational searches when the website has enough useful depth to deserve those rankings.</p><p>Measurement should be decided before scaling. We define the important action, configure tracking and review the path from ad or search result to enquiry. If the page is the bottleneck, improving the headline, proof, call to action or form can be more valuable than simply increasing spend.</p><p>Businesses with repeat purchases or longer sales cycles can also benefit from CRM automation, segmented follow-up and remarketing. This makes the marketing system more useful after the first click and gives the team clearer information about which source is contributing to real revenue.</p></div></section>''',
            'digital-marketing-agency-lake-city-lahore.html': '''<section class="section"><div class="wrap"><h2>A practical Lake City growth plan</h2><p>For businesses serving Lake City, the first priority is to understand whether demand already exists in search or needs to be created. High-intent services can lean more heavily on Google Ads and SEO. Lifestyle, retail and ecommerce offers can use Meta Ads to communicate value visually, test different messages and retarget users who have interacted with the brand.</p><p>We also evaluate the website and enquiry journey because premium-looking traffic does not compensate for a weak conversion path. Clear service pages, strong calls to action, relevant proof and fast mobile performance can materially affect the number of leads produced from the same traffic level.</p><p>Tracking, CRM workflows and structured reporting complete the system. Instead of judging performance by impressions alone, the business can see which campaigns create enquiries, which enquiries become qualified and where budget should be moved next. That creates a stronger foundation for scaling beyond one local area.</p></div></section>'''
          }
          for fname, block in loc_pages.items():
              p=Path(fname); s=p.read_text(encoding='utf-8')
              s=s.replace('"url":"https://beemarketingagency.work/"},"areaServed"','"url":"https://beemarketingagency.work/","logo":"https://beemarketingagency.work/assets/bee-marketing-logo.webp"},"areaServed"')
              marker='<section class="section"><div class="wrap faq">'
              if block not in s and marker in s:
                  s=s.replace(marker, block+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          for fname in ['best-digital-marketing-agency-lahore-guide.html','digital-marketing-cost-lahore.html']:
              p=Path(fname); s=p.read_text(encoding='utf-8')
              if '"image":"https://beemarketingagency.work/assets/bee-marketing-logo.webp"' not in s:
                  s=s.replace('"dateModified":"2026-10-15",','"dateModified":"2026-10-15","image":"https://beemarketingagency.work/assets/bee-marketing-logo.webp",',1)
              p.write_text(s,encoding='utf-8')
          p=Path('best-digital-marketing-agency-lahore-guide.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('How to choose the best digital marketing agency in Lahore: evaluate channel expertise, tracking, case studies, local relevance, reporting and conversion strategy.','Choose a digital marketing agency in Lahore by comparing strategy, tracking, proof, channel expertise, reporting and conversion support.')
          p.write_text(s,encoding='utf-8')
          p=Path('blog.html'); s=p.read_text(encoding='utf-8')
          if 'rel="canonical"' not in s:
              s=s.replace('</head>','<link rel="canonical" href="https://beemarketingagency.work/blog.html"/>\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/lahore-seo-fixes.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "SEO: fix Lahore schema canonicals and content depth" || exit 0
          git push
