name: Tighten industrial city batch 2 meta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-industrial-city-2-meta.yml']
permissions:
  contents: write
jobs:
  fix-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten meta descriptions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'manufacturing-marketing-agency-gujrat.html': (
              'B2B digital marketing for Gujrat manufacturers in electric fans, appliances, furniture and industrial supply using SEO, Google Ads, RFQ funnels and CRM tracking.',
              'B2B digital marketing for Gujrat manufacturers in fans, appliances and industrial supply using SEO, Google Ads, RFQ funnels and CRM tracking.'
            ),
            'manufacturing-marketing-agency-hyderabad.html': (
              'B2B digital marketing for Hyderabad manufacturers and exporters in textiles, leather goods, glass, handicrafts and industrial supply using SEO, Google Ads and RFQ funnels.',
              'B2B digital marketing for Hyderabad manufacturers in textiles, leather, glass and industrial supply using SEO, Google Ads, export leads and RFQ funnels.'
            ),
            'manufacturing-marketing-agency-peshawar.html': (
              'B2B digital marketing for Peshawar manufacturers in food, marble, plastics, furniture, textiles, pharma, packaging and engineering using SEO, Google Ads and RFQ funnels.',
              'B2B marketing for Peshawar manufacturers in food, marble, plastics, pharma, packaging and engineering using SEO, Google Ads and RFQ funnels.'
            )
          }
          for fn, (old, new) in replacements.items():
              p = Path(fn)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected meta not found in {fn}')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-industrial-city-2-meta.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manufacturing-marketing-agency-gujrat.html manufacturing-marketing-agency-hyderabad.html manufacturing-marketing-agency-peshawar.html .github/workflows/fix-industrial-city-2-meta.yml
          git commit -m 'SEO: tighten industrial city batch 2 meta descriptions'
          git push origin HEAD:main
