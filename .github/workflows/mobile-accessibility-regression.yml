name: Mobile Accessibility Regression
on:
  pull_request:
    paths:
      - index.html
      - tools/mobile-accessibility-check.mjs
      - .github/workflows/mobile-accessibility-regression.yml
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve PR version
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/homepage.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
      - name: Validate mobile keyboard and assistive behavior
        run: node tools/mobile-accessibility-check.mjs
