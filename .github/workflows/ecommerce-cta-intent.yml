name: Ecommerce CTA Intent Check
on:
  pull_request:
    paths:
      - ecommerce-agency-pakistan.html
      - tools/ecommerce-cta-intent-check.mjs
      - .github/workflows/ecommerce-cta-intent.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bee.log 2>&1 &
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/ecommerce-agency-pakistan.html -o /dev/null; then break; fi
            sleep 1
          done
      - name: Validate ecommerce consultation event is not a lead
        run: node tools/ecommerce-cta-intent-check.mjs
