name: Bee Marketing SEO Brand Alignment

on:
  push:
    paths:
      - '.github/workflows/bee-marketing-brand-seo.yml'

permissions:
  contents: write

jobs:
  align-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Align SEO-facing brand signals to Bee Marketing
        shell: python
        run: |
          from pathlib import Path

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected pattern: {label}")
              return text.replace(old, new, 1)

          # Homepage
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = replace_required(s,
              '<title>Digital Marketing Agency Pakistan | Ecommerce Growth — Usama</title>',
              '<title>Digital Marketing Agency Pakistan | Ecommerce Growth — Bee Marketing</title>',
              'homepage title')
          s = replace_required(s,
              '<meta property="og:title" content="Digital Marketing Agency Pakistan | Ecommerce Growth — Usama"/>',
              '<meta property="og:title" content="Digital Marketing Agency Pakistan | Ecommerce Growth — Bee Marketing"/>',
              'homepage og title')
          s = replace_required(s,
              '<meta name="twitter:title" content="Digital Marketing Agency Pakistan | Ecommerce Growth — Usama"/>',
              '<meta name="twitter:title" content="Digital Marketing Agency Pakistan | Ecommerce Growth — Bee Marketing"/>',
              'homepage twitter title')
          org_old = '''"@type": "Organization",
      "@id": "https://osamaghaffar-the-specialist.github.io/usama-ghaffar-portfolio/#organization",
      "name": "Usama Ghaffar",'''
          org_new = '''"@type": "Organization",
      "@id": "https://osamaghaffar-the-specialist.github.io/usama-ghaffar-portfolio/#organization",
      "name": "Bee Marketing",'''
          s = replace_required(s, org_old, org_new, 'homepage organization schema')
          s = s.replace('<span class="logo-name">Usama Ghaffar</span>', '<span class="logo-name">Bee Marketing</span>', 1)
          p.write_text(s, encoding='utf-8')

          # Services hub
          p = Path('services.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Digital Marketing Services Pakistan | Meta Ads, Ecommerce & SEO — Usama Ghaffar', 'Digital Marketing Services Pakistan | Meta Ads, Ecommerce & SEO — Bee Marketing', 1)
          s = s.replace('>Usama Ghaffar</a>', '>Bee Marketing</a>', 1)
          p.write_text(s, encoding='utf-8')

          # Ecommerce page
          p = Path('ecommerce-agency-pakistan.html')
          s = p.read_text(encoding='utf-8')
          s = replace_required(s,
              '<title>Ecommerce Agency Pakistan | Meta &amp; Google Ads — Usama Ghaffar</title>',
              '<title>Ecommerce Agency Pakistan | Meta &amp; Google Ads — Bee Marketing</title>',
              'ecommerce title')
          s = s.replace('<meta property="og:title" content="Ecommerce Agency Pakistan | Meta &amp; Google Ads — Usama Ghaffar"/>', '<meta property="og:title" content="Ecommerce Agency Pakistan | Meta &amp; Google Ads — Bee Marketing"/>', 1)
          s = s.replace('<meta name="twitter:title" content="Ecommerce Agency Pakistan | Meta &amp; Google Ads — Usama Ghaffar"/>', '<meta name="twitter:title" content="Ecommerce Agency Pakistan | Meta &amp; Google Ads — Bee Marketing"/>', 1)
          s = s.replace('"provider":{"@type":"Person","name":"Usama Ghaffar","url":"https://osamaghaffar-the-specialist.github.io/usama-ghaffar-portfolio/"}', '"provider":{"@type":"Organization","name":"Bee Marketing","url":"https://osamaghaffar-the-specialist.github.io/usama-ghaffar-portfolio/","founder":{"@type":"Person","name":"Usama Ghaffar"}}', 1)
          s = s.replace('<a class="brand" href="index.html">Usama Ghaffar</a>', '<a class="brand" href="index.html">Bee Marketing</a>', 1)
          p.write_text(s, encoding='utf-8')

          # Facebook / Meta Ads page
          p = Path('facebook-ads-agency-pakistan.html')
          s = p.read_text(encoding='utf-8')
          s = replace_required(s,
              '<title>Facebook Ads Agency Pakistan | Meta Ads Management — Usama Ghaffar</title>',
              '<title>Facebook Ads Agency Pakistan | Meta Ads Management — Bee Marketing</title>',
              'facebook ads title')
          s = s.replace('<meta property="og:title" content="Facebook Ads Agency Pakistan | Meta Ads Management — Usama Ghaffar"/>', '<meta property="og:title" content="Facebook Ads Agency Pakistan | Meta Ads Management — Bee Marketing"/>', 1)
          s = s.replace('<meta name="twitter:title" content="Facebook Ads Agency Pakistan | Meta Ads Management — Usama Ghaffar"/>', '<meta name="twitter:title" content="Facebook Ads Agency Pakistan | Meta Ads Management — Bee Marketing"/>', 1)
          s = s.replace('"provider":{"@type":"Person","name":"Usama Ghaffar","url":"https://osamaghaffar-the-specialist.github.io/usama-ghaffar-portfolio/"}', '"provider":{"@type":"Organization","name":"Bee Marketing","url":"https://osamaghaffar-the-specialist.github.io/usama-ghaffar-portfolio/","founder":{"@type":"Person","name":"Usama Ghaffar"}}', 1)
          s = s.replace('<a class="brand" href="index.html">Usama Ghaffar</a>', '<a class="brand" href="index.html">Bee Marketing</a>', 1)
          p.write_text(s, encoding='utf-8')

          # Validation
          assert 'Bee Marketing' in Path('index.html').read_text(encoding='utf-8')
          assert 'Bee Marketing' in Path('services.html').read_text(encoding='utf-8')
          assert 'Bee Marketing' in Path('ecommerce-agency-pakistan.html').read_text(encoding='utf-8')
          assert 'Bee Marketing' in Path('facebook-ads-agency-pakistan.html').read_text(encoding='utf-8')

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bee-marketing-brand-seo.yml
          git add index.html services.html ecommerce-agency-pakistan.html facebook-ads-agency-pakistan.html
          git commit -m "SEO: align Pakistan agency branding to Bee Marketing"
          git push
