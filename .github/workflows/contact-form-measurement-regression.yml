name: Contact Form Measurement Regression
on:
  pull_request:
    paths:
      - contact.html
      - tools/contact-form-measurement-check.mjs
      - .github/workflows/contact-form-measurement-regression.yml
  push:
    branches: [main]
    paths:
      - contact.html
      - tools/contact-form-measurement-check.mjs
      - .github/workflows/contact-form-measurement-regression.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local preview (no actual leads)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/contact.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/contact.html -o /dev/null; then break; fi
            sleep 1
          done
      - name: Simulate form success and errors without sending to provider
        run: node tools/contact-form-measurement-check.mjs
