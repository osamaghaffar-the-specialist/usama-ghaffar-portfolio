name: Apply bee startup fix
on:
  push:
    branches: [fix/bee-startup]
    paths: [.github/workflows/bee-startup-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bee-startup
      - name: Apply scoped homepage bee startup patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changes = [
            ('<link href="//cdnjs.cloudflare.com" rel="dns-prefetch"/>\n', '<link href="//cdnjs.cloudflare.com" rel="dns-prefetch"/>\n<link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"/>\n'),
            ('  .bee-instant-poster{position:absolute;inset:10%;z-index:1;border-radius:50%;background:url("assets/images/bee-instant-poster.webp") center/cover no-repeat;opacity:.92;filter:drop-shadow(0 16px 24px rgba(11,14,20,.10));transition:opacity .24s ease,transform .6s ease;animation:beePosterFloat 2.8s ease-in-out infinite;pointer-events:none}\n  .bee-stage.bee-ready .bee-instant-poster{opacity:0;transform:scale(.96)}\n  @keyframes beePosterFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}\n\n', ''),
            ('<div aria-hidden="true" class="bee-instant-poster"></div>\n', ''),
            ('<!-- Three.js loads after the page markup; the lightweight poster keeps the bee visible immediately. -->\n<script crossorigin="anonymous" referrerpolicy="no-referrer" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>', '<!-- Three.js is preloaded from the head, then executed here after the page markup. -->\n<script crossorigin="anonymous" fetchpriority="high" referrerpolicy="no-referrer" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>'),
            ('const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});', 'const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:"high-performance"});'),
            ('    bee.position.y = 0.5;\n    bee.scale.setScalar(0.9);', '    bee.position.y = 0.5;\n    bee.rotation.y = 0.5;\n    bee.scale.setScalar(0.9);'),
            ('    // Compile and paint the first frame immediately so the hero never appears empty.\n    renderer.compile(scene, camera);\n    renderer.render(scene, camera);\n    canvas.dataset.ready = "true"; canvas.parentElement.classList.add("bee-ready");\n', '    // Paint the first 3D frame as soon as the scene is ready.\n    renderer.render(scene, camera);\n')
          ]
          for i, (old, new) in enumerate(changes, 1):
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Patch {i} expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove obsolete poster asset and verify scope
        run: |
          rm -f assets/images/bee-instant-poster.webp
          ! grep -q 'bee-instant-poster' index.html
          git diff --check
          test "$(git diff --name-only | sort)" = $'assets/images/bee-instant-poster.webp\nindex.html'
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/images/bee-instant-poster.webp
          git commit -m 'Fix hero bee startup performance'
          git push origin fix/bee-startup
