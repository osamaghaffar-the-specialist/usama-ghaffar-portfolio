name: Finalize leather meta description
on:
  push:
    paths:
      - '.github/workflows/fix-leather-meta.yml'
permissions:
  contents: write
jobs:
  fix-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten leather meta description
        shell: python
        run: |
          from pathlib import Path
          p=Path('leather-tannery-marketing-pakistan.html')
          t=p.read_text(encoding='utf-8')
          old='Digital marketing for leather manufacturers and tanneries in Pakistan targeting brands, sourcing teams and export buyers through SEO, Ads and B2B lead generation.'
          new='Digital marketing for leather manufacturers and tanneries in Pakistan targeting brands, sourcing teams and export buyers with SEO, Ads and B2B lead generation.'
          if old not in t: raise SystemExit('target meta not found')
          p.write_text(t.replace(old,new),encoding='utf-8')
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-leather-meta.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: finalize leather meta description"
          git push
