name: Wire Lahore AEO guides
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lahore-aeo-internal-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add internal links
        run: |
          python - <<'PY'
          from pathlib import Path

          blocks = {
            'digital-marketing-agency-lahore.html': '''\n<!-- lahore-answer-guides -->\n<section style="padding:72px 0;background:#f7f8fb"><div class="wrap"><div class="eyebrow">Lahore marketing answers</div><h2 style="font-size:clamp(32px,4vw,48px);margin-bottom:18px">Research the decision before you spend.</h2><p style="max-width:780px;margin-bottom:24px">Use our Lahore buyer guides to compare costs, timelines and hiring options before choosing a channel or provider.</p><p><a href="seo-cost-lahore.html"><strong>SEO Cost in Lahore →</strong></a> &nbsp; · &nbsp; <a href="google-ads-cost-lahore.html"><strong>Google Ads Cost →</strong></a> &nbsp; · &nbsp; <a href="meta-ads-cost-lahore.html"><strong>Meta Ads Cost →</strong></a> &nbsp; · &nbsp; <a href="digital-marketing-agency-vs-freelancer-lahore.html"><strong>Agency vs Freelancer →</strong></a> &nbsp; · &nbsp; <a href="how-long-does-seo-take-lahore.html"><strong>SEO Timeline →</strong></a></p></div></section>\n''',
            'blog.html': '''\n<!-- lahore-answer-guides -->\n<section style="padding:72px 24px;background:#f7f8fb"><div style="max-width:1120px;margin:auto"><h2>Lahore Marketing Cost & Decision Guides</h2><p>Practical answers for businesses comparing SEO, Google Ads, Meta Ads and marketing providers in Lahore.</p><p><a href="seo-cost-lahore.html">SEO Cost in Lahore</a> · <a href="google-ads-cost-lahore.html">Google Ads Cost in Lahore</a> · <a href="meta-ads-cost-lahore.html">Meta Ads Cost in Lahore</a> · <a href="digital-marketing-agency-vs-freelancer-lahore.html">Agency vs Freelancer</a> · <a href="how-long-does-seo-take-lahore.html">How Long SEO Takes</a></p></div></section>\n''',
            'services.html': '''\n<!-- lahore-answer-guides -->\n<section style="padding:72px 24px;background:#f7f8fb"><div style="max-width:1120px;margin:auto"><h2>Lahore Buyer Guides</h2><p>Compare channel economics and timelines before selecting a service.</p><p><a href="seo-cost-lahore.html">SEO Cost</a> · <a href="google-ads-cost-lahore.html">Google Ads Cost</a> · <a href="meta-ads-cost-lahore.html">Meta Ads Cost</a> · <a href="digital-marketing-agency-vs-freelancer-lahore.html">Agency vs Freelancer</a> · <a href="how-long-does-seo-take-lahore.html">SEO Timeline</a></p></div></section>\n''',
            'seo-agency-lahore.html': '''\n<!-- lahore-answer-guides -->\n<section style="padding:56px 24px;background:#f7f8fb"><div style="max-width:900px;margin:auto"><h2>Planning SEO in Lahore?</h2><p>Read <a href="seo-cost-lahore.html"><strong>SEO Cost in Lahore</strong></a> and <a href="how-long-does-seo-take-lahore.html"><strong>How Long SEO Takes in Lahore</strong></a> before comparing proposals.</p></div></section>\n''',
            'google-ads-agency-lahore.html': '''\n<!-- lahore-answer-guides -->\n<section style="padding:56px 24px;background:#f7f8fb"><div style="max-width:900px;margin:auto"><h2>Planning a Google Ads budget?</h2><p>Read our <a href="google-ads-cost-lahore.html"><strong>Google Ads Cost in Lahore</strong></a> guide for media spend, agency fees, CPC and conversion economics.</p></div></section>\n''',
            'meta-ads-agency-lahore.html': '''\n<!-- lahore-answer-guides -->\n<section style="padding:56px 24px;background:#f7f8fb"><div style="max-width:900px;margin:auto"><h2>Planning a Meta Ads budget?</h2><p>Read our <a href="meta-ads-cost-lahore.html"><strong>Meta Ads Cost in Lahore</strong></a> guide for creative, media spend, tracking and campaign economics.</p></div></section>\n''',
            'digital-marketing-cost-lahore.html': '''\n<!-- lahore-answer-guides -->\n<section style="padding:56px 24px;background:#f7f8fb"><div style="max-width:900px;margin:auto"><h2>Go deeper by channel</h2><p><a href="seo-cost-lahore.html">SEO Cost in Lahore</a> · <a href="google-ads-cost-lahore.html">Google Ads Cost in Lahore</a> · <a href="meta-ads-cost-lahore.html">Meta Ads Cost in Lahore</a> · <a href="digital-marketing-agency-vs-freelancer-lahore.html">Agency vs Freelancer</a> · <a href="how-long-does-seo-take-lahore.html">SEO Timeline</a></p></div></section>\n'''
          }

          changed = []
          for filename, block in blocks.items():
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'lahore-answer-guides' in text:
                  continue
              if '</main>' not in text:
                  continue
              text = text.replace('</main>', block + '</main>', 1)
              p.write_text(text, encoding='utf-8')
              changed.append(filename)
          print('patched:', changed)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/lahore-aeo-internal-links.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: link Lahore AEO guide cluster across site" || exit 0
          git push
