name: Hero Mobile Performance Preview
on:
  pull_request:
    paths:
      - index.html
      - tools/hero-mobile-review.mjs
      - .github/workflows/hero-mobile-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve pull request version locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bee-preview-server.log 2>&1 &
          for i in {1..25}; do
            curl -fsS http://127.0.0.1:8765/ -o /dev/null && break
            sleep 1
          done
      - name: Compare live homepage versus PR preview on mobile
        run: node tools/hero-mobile-review.mjs
      - name: Upload browser screenshots and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-mobile-preview
          path: hero-review-output/
          retention-days: 14
          if-no-files-found: warn
