name: Wire corporate and high-ticket pages
on:
  push:
    paths:
      - '.github/workflows/corporate-industry-internal-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add internal links
        run: |
          python - <<'PY'
          from pathlib import Path

          blocks = {
            'education-marketing-agency-lahore.html': '''\n<!-- corporate-industry-expansion -->\n<section style="padding:56px 24px;background:#f7f8fb"><div style="max-width:900px;margin:auto"><h2>School admissions marketing in Lahore</h2><p>Schools and multi-campus education groups can explore our dedicated <a href="school-marketing-agency-lahore.html"><strong>School Marketing Agency Lahore</strong></a> page for parent search, open-day campaigns, campus pages and admissions follow-up.</p></div></section>\n''',
            'clinic-digital-marketing-lahore.html': '''\n<!-- corporate-industry-expansion -->\n<section style="padding:56px 24px;background:#f7f8fb"><div style="max-width:900px;margin:auto"><h2>Specialist healthcare marketing</h2><p>Explore dedicated growth systems for <a href="hospital-digital-marketing-lahore.html"><strong>Hospitals</strong></a>, <a href="dental-clinic-marketing-lahore.html"><strong>Dental Clinics</strong></a> and <a href="aesthetic-clinic-marketing-lahore.html"><strong>Aesthetic Clinics</strong></a> in Lahore.</p></div></section>\n''',
            'real-estate-digital-marketing-lahore.html': '''\n<!-- corporate-industry-expansion -->\n<section style="padding:56px 24px;background:#f7f8fb"><div style="max-width:900px;margin:auto"><h2>Marketing for developers and project launches</h2><p>For developers, builders and project owners, see our dedicated <a href="real-estate-developer-marketing-lahore.html"><strong>Real Estate Developer Marketing Lahore</strong></a> page covering launches, qualified buyer leads, CRM routing and project-level reporting.</p></div></section>\n''',
            'digital-marketing-agency-lahore.html': '''\n<!-- corporate-industry-expansion -->\n<section style="padding:56px 24px;background:#f7f8fb"><div style="max-width:1000px;margin:auto"><h2>High-value industries we help in Lahore</h2><p><a href="school-marketing-agency-lahore.html"><strong>Schools</strong></a> · <a href="hospital-digital-marketing-lahore.html"><strong>Hospitals</strong></a> · <a href="dental-clinic-marketing-lahore.html"><strong>Dental Clinics</strong></a> · <a href="aesthetic-clinic-marketing-lahore.html"><strong>Aesthetic Clinics</strong></a> · <a href="real-estate-developer-marketing-lahore.html"><strong>Real Estate Developers</strong></a>. For national corporate and B2B growth, see <a href="corporate-digital-marketing-agency-pakistan.html"><strong>Corporate Digital Marketing Agency Pakistan</strong></a>.</p></div></section>\n''',
            'services.html': '''\n<!-- corporate-industry-expansion -->\n<section style="padding:64px 24px;background:#f7f8fb"><div style="max-width:1050px;margin:auto"><h2>Corporate & high-ticket growth services</h2><p>Bee Marketing also builds acquisition systems for <a href="corporate-digital-marketing-agency-pakistan.html"><strong>corporate and B2B organizations in Pakistan</strong></a>, plus Lahore-focused strategies for <a href="school-marketing-agency-lahore.html">schools</a>, <a href="hospital-digital-marketing-lahore.html">hospitals</a>, <a href="dental-clinic-marketing-lahore.html">dental clinics</a>, <a href="aesthetic-clinic-marketing-lahore.html">aesthetic clinics</a> and <a href="real-estate-developer-marketing-lahore.html">real estate developers</a>.</p></div></section>\n''',
            'blog.html': '''\n<!-- corporate-industry-expansion -->\n<section style="padding:64px 24px;background:#f7f8fb"><div style="max-width:1050px;margin:auto"><h2>Industry growth playbooks</h2><p>Explore commercial marketing systems for <a href="corporate-digital-marketing-agency-pakistan.html"><strong>corporate & B2B organizations</strong></a>, <a href="school-marketing-agency-lahore.html">schools</a>, <a href="hospital-digital-marketing-lahore.html">hospitals</a>, <a href="dental-clinic-marketing-lahore.html">dental clinics</a>, <a href="aesthetic-clinic-marketing-lahore.html">aesthetic clinics</a> and <a href="real-estate-developer-marketing-lahore.html">property developers</a>.</p></div></section>\n'''
          }

          for filename, block in blocks.items():
              p = Path(filename)
              if not p.exists():
                  raise SystemExit(f'Missing {filename}')
              text = p.read_text(encoding='utf-8')
              if '<!-- corporate-industry-expansion -->' in text:
                  continue
              if '</main>' not in text:
                  raise SystemExit(f'No </main> in {filename}')
              text = text.replace('</main>', block + '</main>', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/corporate-industry-internal-links.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: link corporate and high-ticket industry cluster" || exit 0
          git push
