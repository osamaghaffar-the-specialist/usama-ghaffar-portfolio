name: Meta Ads Internal Linking

on:
  push:
    paths:
      - '.github/workflows/meta-ads-internal-linking.yml'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add contextual links to Facebook Ads money page
        shell: python
        run: |
          from pathlib import Path
          import re

          target = "facebook-ads-agency-pakistan.html"

          # Homepage: link the first visible Meta Ads mention in the body.
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          head, body = text.split("<body>", 1)
          if target not in body:
              body = body.replace(
                  "Meta Ads",
                  '<a href="facebook-ads-agency-pakistan.html" aria-label="Facebook and Meta Ads agency in Pakistan" style="text-decoration:underline;text-underline-offset:3px">Meta Ads</a>',
                  1,
              )
          p.write_text(head + "<body>" + body, encoding="utf-8")

          # Services hub: add a natural contextual sentence inside the hero copy.
          p = Path("services.html")
          text = p.read_text(encoding="utf-8")
          if target not in text:
              m = re.search(r'(<div class="hero-copy">.*?<p>)(.*?)(</p>)', text, flags=re.S)
              if not m:
                  raise SystemExit("Services hero paragraph not found")
              addition = ' For paid social acquisition, explore our <a href="facebook-ads-agency-pakistan.html" style="text-decoration:underline;text-underline-offset:3px;font-weight:600">Facebook &amp; Meta Ads agency services in Pakistan</a>.'
              replacement = m.group(1) + m.group(2).rstrip() + addition + m.group(3)
              text = text[:m.start()] + replacement + text[m.end():]
          p.write_text(text, encoding="utf-8")

          # Ecommerce money page: link the first visible Meta Ads mention in the body.
          p = Path("ecommerce-agency-pakistan.html")
          text = p.read_text(encoding="utf-8")
          head, body = text.split("<body>", 1)
          if target not in body:
              body = body.replace(
                  "Meta Ads",
                  '<a href="facebook-ads-agency-pakistan.html" style="text-decoration:underline;text-underline-offset:3px">Meta Ads</a>',
                  1,
              )
          p.write_text(head + "<body>" + body, encoding="utf-8")

          # Validation
          for filename in ["index.html", "services.html", "ecommerce-agency-pakistan.html"]:
              assert target in Path(filename).read_text(encoding="utf-8"), f"Missing Meta Ads internal link in {filename}"

      - name: Commit updates and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/meta-ads-internal-linking.yml
          git add index.html services.html ecommerce-agency-pakistan.html
          git commit -m "SEO: link Facebook Ads money page across site"
          git push
