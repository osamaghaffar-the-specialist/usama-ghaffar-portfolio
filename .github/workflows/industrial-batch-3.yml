            'manufacturer-digital-marketing-pakistan.html': ('Dedicated vertical strategies are also available for <a href="factory-marketing-agency-pakistan.html">factory owners</a>, <a href="textile-marketing-agency-pakistan.html">textile businesses</a> and <a href="mill-marketing-agency-pakistan.html">mill owners</a>.', 'Dedicated vertical strategies are also available for <a href="factory-marketing-agency-pakistan.html">factory owners</a>, <a href="textile-marketing-agency-pakistan.html">textile businesses</a>, <a href="mill-marketing-agency-pakistan.html">mill owners</a>, <a href="chemical-manufacturer-marketing-pakistan.html">chemical manufacturers</a>, <a href="auto-parts-manufacturer-marketing-pakistan.html">auto parts manufacturers</a>, <a href="leather-tannery-marketing-pakistan.html">leather and tannery businesses</a>, <a href="surgical-instrument-manufacturer-marketing-pakistan.html">surgical instrument manufacturers</a> and <a href="sports-goods-manufacturer-marketing-pakistan.html">sports goods manufacturers</a>.')
          }
          for name,(old,new) in hub_updates.items():
              path=ROOT/name
              txt=path.read_text(encoding='utf-8')
              if old not in txt:
                  raise SystemExit(f'Expected hub text not found in {name}')
              path.write_text(txt.replace(old,new,1),encoding='utf-8')

      - name: Remove one-time workflow
