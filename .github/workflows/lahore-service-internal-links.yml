name: Wire Lahore service pages
on:
  push:
    paths:
      - '.github/workflows/lahore-service-internal-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add internal links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_once(path, marker, html):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if marker in s:
                  return
              if '</main>' in s:
                  s = s.replace('</main>', html + '\n</main>', 1)
              elif '</body>' in s:
                  s = s.replace('</body>', html + '\n</body>', 1)
              else:
                  s += html
              p.write_text(s, encoding='utf-8')

          hub = '''
          <section data-lahore-service-cluster style="padding:72px 0;background:#f7f8fa;border-top:1px solid rgba(11,14,20,.08)"><div class="wrap"><div class="eyebrow">Lahore service specialists</div><h2 style="font-size:clamp(30px,4vw,48px);margin:0 0 18px">Explore our Lahore growth services.</h2><p style="max-width:800px;margin-bottom:26px">Choose the service page that matches the problem you are trying to solve. Each page explains the strategy, measurement model and how Bee Marketing serves Lahore businesses.</p><div style="display:flex;flex-wrap:wrap;gap:10px"><a class="btn btn-light" href="seo-agency-lahore.html">SEO Agency Lahore</a><a class="btn btn-light" href="google-ads-agency-lahore.html">Google Ads Agency Lahore</a><a class="btn btn-light" href="meta-ads-agency-lahore.html">Meta Ads Agency Lahore</a><a class="btn btn-light" href="ecommerce-agency-lahore.html">Ecommerce Agency Lahore</a><a class="btn btn-light" href="performance-marketing-agency-lahore.html">Performance Marketing Lahore</a></div></div></section>'''
          insert_once('digital-marketing-agency-lahore.html', 'data-lahore-service-cluster', hub)

          links = {
            'seo-agency-pakistan.html': ('data-lahore-seo-link', 'SEO Agency Lahore', 'seo-agency-lahore.html'),
            'google-ads-agency-pakistan.html': ('data-lahore-google-link', 'Google Ads Agency Lahore', 'google-ads-agency-lahore.html'),
            'facebook-ads-agency-pakistan.html': ('data-lahore-meta-link', 'Meta Ads Agency Lahore', 'meta-ads-agency-lahore.html'),
            'ecommerce-agency-pakistan.html': ('data-lahore-ecom-link', 'Ecommerce Agency Lahore', 'ecommerce-agency-lahore.html'),
            'performance-marketing-agency-pakistan.html': ('data-lahore-performance-link', 'Performance Marketing Agency Lahore', 'performance-marketing-agency-lahore.html'),
          }
          for path, (marker, label, href) in links.items():
              html = f'''<section {marker} style="padding:38px 0;border-top:1px solid rgba(11,14,20,.08)"><div class="wrap"><p style="margin:0">Looking for local Lahore support? <a href="{href}"><strong>{label} →</strong></a></p></div></section>'''
              insert_once(path, marker, html)

          services = '''<section data-lahore-services-link style="padding:42px 0;border-top:1px solid rgba(11,14,20,.08)"><div class="wrap"><p style="margin:0"><strong>Lahore:</strong> <a href="seo-agency-lahore.html">SEO</a> · <a href="google-ads-agency-lahore.html">Google Ads</a> · <a href="meta-ads-agency-lahore.html">Meta Ads</a> · <a href="ecommerce-agency-lahore.html">Ecommerce</a> · <a href="performance-marketing-agency-lahore.html">Performance Marketing</a></p></div></section>'''
          insert_once('services.html', 'data-lahore-services-link', services)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/lahore-service-internal-links.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: link Lahore service cluster across site" || exit 0
          git push
