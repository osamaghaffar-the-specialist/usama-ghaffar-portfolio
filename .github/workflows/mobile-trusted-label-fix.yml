name: Apply mobile trusted label fix
on:
  push:
    branches: [fix/mobile-trusted-logo-labels]
    paths: [.github/workflows/mobile-trusted-label-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-trusted-logo-labels
      - name: Apply scoped mobile trusted-logo label patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changes = [
            ('    .logo-name{font-size:1.02rem}\n', '    .logo-badge > .logo-name{font-size:1.02rem}\n'),
            ('    .trusted-logo-badge{margin:0 11px}\n', '    .trusted-logo-badge{margin:0 28px}\n    .trusted-logo-badge .logo-name{font-size:.66rem!important;line-height:1.15!important}\n')
          ]
          for i, (old, new) in enumerate(changes, 1):
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Patch {i} expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile platform label overlap'
          git push origin fix/mobile-trusted-logo-labels