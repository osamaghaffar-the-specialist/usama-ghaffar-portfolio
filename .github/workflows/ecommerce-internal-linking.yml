name: Ecommerce Internal Linking

on:
  push:
    paths:
      - '.github/workflows/ecommerce-internal-linking.yml'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Strengthen ecommerce internal linking
        shell: python
        run: |
          from pathlib import Path
          import re

          ecommerce_url = "ecommerce-agency-pakistan.html"

          # Homepage: make the ecommerce-oriented secondary CTA point to the dedicated money page
          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          old_cta = '<a class="btn-secondary" href="performance-marketing.html">See Ecommerce Results</a>'
          new_cta = '<a class="btn-secondary" href="ecommerce-agency-pakistan.html">Explore Ecommerce Growth</a>'
          if old_cta in index:
              index = index.replace(old_cta, new_cta, 1)
          elif ecommerce_url not in index:
              raise SystemExit("Homepage ecommerce CTA pattern not found")

          old_lead = 'We help ecommerce and growing brands turn paid traffic into profitable sales through Meta Ads, Google Ads, conversion strategy, creative testing and measurable performance marketing.'
          new_lead = 'We help <a href="ecommerce-agency-pakistan.html" aria-label="Ecommerce agency services in Pakistan" style="text-decoration:underline;text-underline-offset:3px">ecommerce brands in Pakistan</a> and other growing businesses turn paid traffic into profitable sales through Meta Ads, Google Ads, conversion strategy, creative testing and measurable performance marketing.'
          if old_lead in index:
              index = index.replace(old_lead, new_lead, 1)

          index_path.write_text(index, encoding="utf-8")

          # Services hub: improve search positioning and add a contextual link to the ecommerce money page
          services_path = Path("services.html")
          services = services_path.read_text(encoding="utf-8")
          services = services.replace(
              '<title>Services — Usama Ghaffar</title>',
              '<title>Digital Marketing Services Pakistan | Meta Ads, Ecommerce & SEO — Usama Ghaffar</title>',
              1,
          )
          services = services.replace(
              '<meta content="Performance marketing, AI creative systems, conversion-focused websites, SaaS products and business automation by Usama Ghaffar." name="description"/>',
              '<meta content="Digital marketing services in Pakistan for ecommerce and growing brands, including Meta Ads, Google Ads, performance marketing, SEO, CRO, websites and automation." name="description"/>',
              1,
          )
          canonical = '<link rel="canonical" href="https://osamaghaffar-the-specialist.github.io/usama-ghaffar-portfolio/services.html"/>'
          if canonical not in services:
              marker = '<meta content="Digital marketing services in Pakistan for ecommerce and growing brands, including Meta Ads, Google Ads, performance marketing, SEO, CRO, websites and automation." name="description"/>'
              services = services.replace(marker, marker + '\n' + canonical, 1)

          if ecommerce_url not in services:
              hero_match = re.search(r'(<div class="hero-copy">.*?<p>)(.*?)(</p>)', services, flags=re.S)
              if not hero_match:
                  raise SystemExit("Services hero paragraph not found")
              body = hero_match.group(2)
              addition = ' For online stores, explore our <a href="ecommerce-agency-pakistan.html" style="text-decoration:underline;text-underline-offset:3px;font-weight:600">ecommerce growth and performance marketing services in Pakistan</a>.'
              replacement = hero_match.group(1) + body.rstrip() + addition + hero_match.group(3)
              services = services[:hero_match.start()] + replacement + services[hero_match.end():]

          services_path.write_text(services, encoding="utf-8")

          # Validation
          index_final = index_path.read_text(encoding="utf-8")
          services_final = services_path.read_text(encoding="utf-8")
          assert index_final.count(ecommerce_url) >= 2, "Homepage should contain at least two ecommerce internal links"
          assert ecommerce_url in services_final, "Services hub must link to ecommerce money page"
          assert 'Digital Marketing Services Pakistan' in services_final, "Services title update missing"

      - name: Commit updates and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ecommerce-internal-linking.yml
          git add index.html services.html
          git commit -m "SEO: strengthen ecommerce internal linking"
          git push
