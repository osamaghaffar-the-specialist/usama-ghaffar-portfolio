name: Wire Lahore expansion pages
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          block = '''\n<section class="section" id="lahore-expansion"><div class="wrap"><div class="eyebrow">Lahore coverage & guides</div><h2 style="font-size:clamp(34px,4.5vw,55px);margin-bottom:20px">Explore more Lahore areas and decision guides.</h2><p><a href="digital-marketing-agency-valencia-town-lahore.html"><strong>Valencia Town</strong></a> · <a href="digital-marketing-agency-eme-society-lahore.html"><strong>EME Society</strong></a> · <a href="digital-marketing-agency-model-town-lahore.html"><strong>Model Town</strong></a> · <a href="digital-marketing-agency-lake-city-lahore.html"><strong>Lake City</strong></a></p><p style="margin-top:14px"><a href="best-digital-marketing-agency-lahore-guide.html"><strong>How to Choose the Best Digital Marketing Agency in Lahore →</strong></a><br/><a href="digital-marketing-cost-lahore.html"><strong>Digital Marketing Cost in Lahore →</strong></a></p></div></section>\n'''
          for fname in ['digital-marketing-agency-lahore.html','blog.html']:
              p=Path(fname)
              s=p.read_text(encoding='utf-8')
              if 'id="lahore-expansion"' not in s and '</main>' in s:
                  s=s.replace('</main>', block+'</main>', 1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/lahore-authority-links.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital-marketing-agency-lahore.html blog.html .github/workflows/lahore-authority-links.yml
          git commit -m "SEO: link Lahore expansion and authority content" || exit 0
          git push
